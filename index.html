<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">

<head>
    <meta charset="UTF-8">

    <!-- مهم جداً لعرض الموقع الصحيح على الهاتف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="page-title">الروابط المساعدة للمدرس</title>

    <!-- خط Tajawal -->
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* ======================================
           الهيدر
        ====================================== */

        header {
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);

            padding: 18px 35px;
        }


        /*
        توزيع الهيدر على الكمبيوتر:

        الجمعية + اللغة | العنوان | المدرسة
        */

        .header-container {
            width: 100%;

            display: grid;

            grid-template-columns:
                minmax(170px, 1fr)
                minmax(300px, 2fr)
                minmax(170px, 1fr);

            grid-template-areas:
                "left title right";

            align-items: center;

            direction: ltr;
        }


        /* ======================================
           القسم الأيسر
           شعار الجمعية + زر اللغة
        ====================================== */

        .header-section-left {
            grid-area: left;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            gap: 12px;

            direction: ltr;
        }


        /* ======================================
           القسم الأيمن
           شعار المدرسة
        ====================================== */

        .header-section-right {
            grid-area: right;

            display: flex;
            align-items: center;
            justify-content: flex-end;
        }


        /* ======================================
           الشعارات
        ====================================== */

        .logo-box {
            width: 82px;
            height: 82px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .logo-box img {
            display: block;

            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            object-fit: contain;
        }


        /* ======================================
           العنوان
        ====================================== */

        .header-title {
            grid-area: title;

            text-align: center;

            direction: rtl;

            padding: 0 15px;
        }

        .header-title h1 {
            color: #1a365d;

            font-size: 24px;
            font-weight: 700;

            line-height: 1.4;

            margin-bottom: 5px;
        }

        .header-title p {
            color: #718096;

            font-size: 15px;
            font-weight: 700;

            line-height: 1.4;
        }


        /* ======================================
           زر تغيير اللغة
        ====================================== */

        .lang-btn {
            background-color: #e2e8f0;
            color: #2d3748;

            border: 2px solid #cbd5e0;

            min-width: 48px;
            height: 36px;

            padding: 5px 12px;

            border-radius: 8px;

            font-weight: 700;
            font-size: 14px;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .lang-btn:hover {
            background-color: #cbd5e0;
            color: #1a202c;
        }


        /* ======================================
           محتوى الصفحة
        ====================================== */

        main {
            width: 100%;
            max-width: 600px;

            padding: 0 20px;

            display: flex;
            flex-direction: column;

            gap: 20px;

            margin-top: 4cm;
            margin-bottom: 40px;
        }


        /* ======================================
           الأزرار
        ====================================== */

        .btn {
            display: block;

            width: 100%;

            padding: 18px 25px;

            background-color: #2b6cb0;
            color: #ffffff;

            text-align: center;
            text-decoration: none;

            font-size: 18px;
            font-weight: 700;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.10);

            transition: 0.25s ease;
        }


        .btn:hover {
            background-color: #2c5282;

            transform: translateY(-2px);

            box-shadow:
                0 6px 12px rgba(0, 0, 0, 0.15);
        }


        /* الزر المحمي */

        .btn-protected {
            background-color: #c53030;
        }

        .btn-protected:hover {
            background-color: #9b2c2c;
        }


        /* زر الخطط الأسبوعية */

        .btn-sheet {
            background-color: #276749;
        }

        .btn-sheet:hover {
            background-color: #22543d;
        }


        /* ======================================
           الهاتف والتابلت
        ====================================== */

        @media (max-width: 768px) {

            header {
                padding: 14px 15px 18px;
            }


            /*
            في الهاتف:

            الجمعية + اللغة        المدرسة

                    العنوان
            */

            .header-container {

                grid-template-columns:
                    1fr
                    1fr;

                grid-template-areas:
                    "left right"
                    "title title";

                column-gap: 10px;
                row-gap: 12px;
            }


            /* القسم الأيسر */

            .header-section-left {
                justify-self: start;

                gap: 8px;

                width: 100%;

                justify-content: flex-start;
            }


            /* شعار المدرسة */

            .header-section-right {
                justify-self: end;

                width: 100%;

                justify-content: flex-end;
            }


            /* حجم الشعارات */

            .logo-box {
                width: 65px;
                height: 65px;
            }


            /* زر اللغة */

            .lang-btn {
                min-width: 44px;
                height: 34px;

                padding: 4px 10px;

                font-size: 13px;
            }


            /* العنوان */

            .header-title {
                width: 100%;

                padding: 3px 5px 0;

                text-align: center;
            }

            .header-title h1 {
                font-size: 20px;

                margin-bottom: 3px;
            }

            .header-title p {
                font-size: 13px;
            }


            /* المحتوى */

            main {
                padding: 0 15px;

                margin-top: 2cm;

                gap: 18px;
            }


            /* الأزرار */

            .btn {
                padding: 16px 15px;

                font-size: 16px;

                border-radius: 10px;
            }
        }


        /* ======================================
           الهواتف الصغيرة جداً
        ====================================== */

        @media (max-width: 360px) {

            header {
                padding-left: 12px;
                padding-right: 12px;
            }

            .logo-box {
                width: 58px;
                height: 58px;
            }

            .lang-btn {
                min-width: 40px;

                padding: 4px 8px;

                font-size: 12px;
            }

            .header-section-left {
                gap: 5px;
            }

            .header-title h1 {
                font-size: 18px;
            }

            .header-title p {
                font-size: 12px;
            }

            main {
                padding: 0 12px;
            }

            .btn {
                font-size: 15px;
            }
        }

    </style>
</head>


<body>


    <!-- ======================================
         الهيدر
    ======================================= -->

    <header>

        <div class="header-container">


            <!-- الجهة اليسرى:
                 زر اللغة + شعار الجمعية -->

            <div class="header-section-left">

                <button
                    type="button"
                    class="lang-btn"
                    id="lang-toggle-btn"
                    onclick="toggleLanguage()"
                >
                    TR
                </button>


                <div class="logo-box">

                    <img
                        src="association-logo.png"
                        alt="شعار الجمعية"
                    >

                </div>

            </div>



            <!-- العنوان -->

            <div class="header-title">

                <h1 id="txt-title">
                    الروابط المساعدة للمدرس
                </h1>

                <p id="txt-year">
                    للعام الدراسي 2026 - 2027
                </p>

            </div>



            <!-- الجهة اليمنى:
                 شعار المدرسة -->

            <div class="header-section-right">

                <div class="logo-box">

                    <img
                        src="school-logo.png"
                        alt="شعار المدرسة"
                    >

                </div>

            </div>


        </div>

    </header>



    <!-- ======================================
         محتوى الصفحة
    ======================================= -->

    <main>


        <!-- تقييم النظافة -->

        <a
            href="https://manofmaster7-sys.github.io/school-cleaning-eval/"
            target="_blank"
            rel="noopener noreferrer"
            class="btn"
            id="btn-cleaning"
        >
            تقييم النظافة في المدرسة
        </a>



        <!-- الخطط السنوية -->

        <button
            type="button"
            class="btn btn-protected"
            id="btn-plans"
            onclick="openProtectedLink()"
        >
            الخطط السنوية لرؤساء الأقسام 🔒
        </button>



        <!-- الخطط الأسبوعية -->

        <a
            href="https://docs.google.com/spreadsheets/d/1tbbTiHFPEsqaSJOu-K1b99brwUsRU5J7aKNR_M2-ew0/edit?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-sheet"
            id="btn-weekly"
        >
            الخطط الأسبوعية لأولياء الأمور
        </a>


    </main>



    <!-- ======================================
         JavaScript
    ======================================= -->

    <script>

        let currentLang = 'ar';


        const translations = {

            ar: {

                pageTitle:
                    "الروابط المساعدة للمدرس",

                mainTitle:
                    "الروابط المساعدة للمدرس",

                subTitle:
                    "للعام الدراسي 2026 - 2027",

                btnCleaning:
                    "تقييم النظافة في المدرسة",

                btnPlans:
                    "الخطط السنوية لرؤساء الأقسام 🔒",

                btnWeekly:
                    "الخطط الأسبوعية لأولياء الأمور",

                pwdPrompt:
                    "يرجى إدخال كلمة السر للدخول إلى الخطط السنوية:",

                pwdError:
                    "كلمة السر غير صحيحة! يرجى المحاولة مرة أخرى.",

                langBtnText:
                    "TR"
            },


            tr: {

                pageTitle:
                    "Öğretmen Yardımcı Bağlantıları",

                mainTitle:
                    "Öğretmen Yardımcı Bağlantıları",

                subTitle:
                    "2026 - 2027 Eğitim-Öğretim Yılı",

                btnCleaning:
                    "Okul Temizlik Değerlendirmesi",

                btnPlans:
                    "Bölüm Başkanları Yıllık Planları 🔒",

                btnWeekly:
                    "Veliler İçin Haftalık Planlar",

                pwdPrompt:
                    "Lütfen yıllık planlara erişmek için şifreyi giriniz:",

                pwdError:
                    "Yanlış şifre! Lütfen tekrar deneyiniz.",

                langBtnText:
                    "AR"
            }

        };



        /* ======================================
           تغيير اللغة
        ======================================= */

        function toggleLanguage() {

            const htmlTag =
                document.getElementById('html-tag');


            if (currentLang === 'ar') {

                currentLang = 'tr';

                htmlTag.setAttribute(
                    'dir',
                    'ltr'
                );

                htmlTag.setAttribute(
                    'lang',
                    'tr'
                );

            } else {

                currentLang = 'ar';

                htmlTag.setAttribute(
                    'dir',
                    'rtl'
                );

                htmlTag.setAttribute(
                    'lang',
                    'ar'
                );
            }



            document.getElementById(
                'page-title'
            ).innerText =
                translations[currentLang].pageTitle;



            document.getElementById(
                'txt-title'
            ).innerText =
                translations[currentLang].mainTitle;



            document.getElementById(
                'txt-year'
            ).innerText =
                translations[currentLang].subTitle;



            document.getElementById(
                'btn-cleaning'
            ).innerText =
                translations[currentLang].btnCleaning;



            document.getElementById(
                'btn-plans'
            ).innerText =
                translations[currentLang].btnPlans;



            document.getElementById(
                'btn-weekly'
            ).innerText =
                translations[currentLang].btnWeekly;



            document.getElementById(
                'lang-toggle-btn'
            ).innerText =
                translations[currentLang].langBtnText;
        }



        /* ======================================
           الرابط المحمي
        ======================================= */

        function openProtectedLink() {

            const password = prompt(
                translations[currentLang].pwdPrompt
            );


            if (password === "10203055") {

                window.open(
                    "https://drive.google.com/drive/folders/1yUkbiNxybjvBe0gBHTrTe_QRptHCPOXK?usp=sharing",
                    "_blank",
                    "noopener,noreferrer"
                );

            }

            else if (password !== null) {

                alert(
                    translations[currentLang].pwdError
                );

            }

        }

    </script>


</body>

</html>
